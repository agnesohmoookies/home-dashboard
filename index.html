<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Dashboard</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #ffffff;
      --text-sub: #a0a0a0;
      --accent: #ffc107; /* Citybus Yellow */
      --accent-green: #4caf50;
      --border-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow: hidden; /* Prevent native body scrolling */
    }

    /* Swipe Carousel Container */
    .swipe-container {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory; /* Force horizontal snapping */
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch; /* Smooth inertia scrolling for iOS */
      
      /* Hide scrollbars but keep scrolling active */
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none;  /* IE and Edge */
    }

    .swipe-container::-webkit-scrollbar {
      display: none; /* Chrome, Safari, Opera */
    }

    /* Individual Full-Screen Pages */
    .swipe-page {
      width: 100vw;
      height: 100vh;
      flex-shrink: 0;
      scroll-snap-align: start; /* Snap page boundaries */
      padding: 12px;
      display: flex;
      flex-direction: column;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 100%;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .refresh-badge {
      font-size: 0.75rem;
      color: var(--text-sub);
      font-weight: normal;
    }

    /* Bus Stop Headers and List Styling */
    .bus-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding-bottom: 8px;
    }

    .stop-header {
      font-size: 1.15rem; /* Slightly larger size */
      font-weight: bold;
      color: #ffffff; /* Crisp white stop header */
      padding: 8px 0 6px 0;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stop-header:not(:first-child) {
      margin-top: 14px;
    }

    .bus-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #2a2a2a;
    }

    .bus-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bus-route {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 1.05rem;
      min-width: 55px;
      text-align: center;
    }

    /* KMB Red Operator Badge */
    .kmb-route {
      background: #e11d48 !important; /* KMB Red */
      color: #ffffff !important;
    }

    .bus-details {
      display: flex;
      flex-direction: column;
    }

    .bus-dest {
      font-size: 0.85rem;
      color: var(--text-main);
      font-weight: 500;
    }

    .bus-eta {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--accent-green);
      text-align: right;
      cursor: pointer; /* Clickable toggle */
      user-select: none;
    }

    .bus-eta span {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    /* Subtle Grey Separator Styling */
    .bus-eta .separator {
      color: var(--text-sub);
      opacity: 0.6;
      font-weight: normal;
      margin: 0 4px;
    }

    /* Custom Calendar List Styling */
    .calendar-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding-bottom: 4px;
    }

    .calendar-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #2a2a2a;
    }

    .event-time {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--accent); /* Yellow matching stop labels */
      min-width: 65px;
      padding-top: 1px;
    }

    .event-details {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .event-title {
      font-size: 0.9rem;
      color: var(--text-main);
      font-weight: 500;
    }

    .event-desc {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 3px;
    }

    .loading, .error {
      color: var(--text-sub);
      font-size: 0.85rem;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- Snapping Horizontal Carousel -->
  <div class="swipe-container">
    
    <!-- Page 1: Standalone Bus Schedule -->
    <div class="swipe-page">
      <div class="card">
        <ul id="bus-list" class="bus-list">
          <li class="loading">Fetching live Bus data...</li>
        </ul>
        <div class="card-footer">
          <span id="last-updated" class="refresh-badge">Updating...</span>
        </div>
      </div>
    </div>

    <!-- Page 2: Standalone Calendar Schedule (Swipe Right) -->
    <div class="swipe-page">
      <div class="card">
        <ul id="calendar-list" class="calendar-list">
          <li class="loading">Loading calendar events...</li>
        </ul>
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // CONFIGURATION
    // ==========================================
    const API_KEY = "YOUR_GOOGLE_API_KEY"; // Paste your free Google API Key here!
    const CALENDAR_ID = "agnes@ohmoookies.com"; // Your Google Calendar ID

    const BUS_STOPS = [
      { 
        id: "002364", 
        label: "South Horizons", 
        routes: ["592","595","90B","99","171","171P","N90","99X"],
        excludeDest: ["South Horizons", "Ap Lei Chau", "Ap Lei Chau Estate"] 
      }, 
      { 
        id: "002170", 
        label: "Lei Chak House", 
        routes: ["95C","671","671X"],
        excludeDest: ["South Horizons", "Ap Lei Chau", "Ap Lei Chau Estate"] 
      },
      { 
        id: "002166", 
        label: "Ap Lei Chau", 
        routes: ["90","91","N171"],
        excludeDest: ["Ap Lei Chau", "South Horizons", "Ap Lei Chau Estate"] 
      }
    ];

    const JOINT_ROUTES = ["171", "171P", "N171", "671", "671X"];

    const REFRESH_INTERVAL = 30000;
    let lastFetchTime = null;
    let displayAs24Hour = false; // Toggle flag: false = Countdown Mins, true = 24h Clock

    // Helper to determine KMB stop sequence for a given route & stop label
    function getKmbSeq(route, stopLabel) {
      if (route === "171" || route === "171P") {
        if (stopLabel === "South Horizons") return 1;
        if (stopLabel === "Lei Chak House") return 2;
      }
      if (route === "671") {
        if (stopLabel === "Ap Lei Chau") return 1;
        if (stopLabel === "Lei Chak House") return 2;
      }
      if (route === "671X") {
        if (stopLabel === "Lei Chak House") return 1;
      }
      return null;
    }

    // Relative Live Time Counter
    function updateRefreshBadge() {
      const updatedEl = document.getElementById('last-updated');
      if (!lastFetchTime) {
        updatedEl.innerText = "Updating...";
        return;
      }
      const diffSecs = Math.floor((new Date() - lastFetchTime) / 1000);
      if (diffSecs < 60) {
        updatedEl.innerText = `Updated ${diffSecs}s ago`;
      } else {
        const mins = Math.floor(diffSecs / 60);
        updatedEl.innerText = `Updated ${mins}m ago`;
      }
    }
    setInterval(updateRefreshBadge, 1000);

    // ==========================================
    // CUSTOM GOOGLE CALENDAR FETCHING (Today Only)
    // ==========================================
    const MOCK_EVENTS = [
      { summary: "🍳 Breakfast & Get Ready", start: { dateTime: new Date().setHours(7, 30, 0) }, description: "Dress up for school and check morning temperature." },
      { summary: "🚌 School Bus departure", start: { dateTime: new Date().setHours(8, 15, 0) }, description: "Remind him to grab his lunchbox." },
      { summary: "🍱 Nutritious Lunch", start: { dateTime: new Date().setHours(12, 30, 0) }, description: "Freshly prepared meal by the helper." },
      { summary: "📚 Homework & Spellings", start: { dateTime: new Date().setHours(15, 30, 0) }, description: "Practice reading books and spelling words." },
      { summary: "🚿 Shower & Change", start: { dateTime: new Date().setHours(17, 30, 0) }, description: "Wash up before dinner." },
      { summary: "🍽️ Dinner Time", start: { dateTime: new Date().setHours(18, 30, 0) }, description: "Family dinner together." }
    ];

    async function fetchCalendarEvents() {
      const calendarListEl = document.getElementById('calendar-list');
      
      if (!API_KEY || API_KEY === "YOUR_GOOGLE_API_KEY" || API_KEY.trim() === "") {
        renderEvents(MOCK_EVENTS);
        return;
      }

      try {
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
        const endOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59).toISOString();
        
        const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?key=${API_KEY}&timeMin=${startOfToday}&timeMax=${endOfToday}&singleEvents=true&orderBy=startTime`;

        const res = await fetch(url);
        if (!res.ok) throw new Error('API request failed');

        const data = await res.json();
        renderEvents(data.items || []);

      } catch (error) {
        console.error('Error fetching Google Calendar:', error);
        renderEvents(MOCK_EVENTS);
      }
    }

    function renderEvents(events) {
      const calendarListEl = document.getElementById('calendar-list');
      
      if (events.length === 0) {
        calendarListEl.innerHTML = '<li class="loading">No events scheduled for today.</li>';
        return;
      }

      calendarListEl.innerHTML = events.map(event => {
        const start = event.start.dateTime ? new Date(event.start.dateTime) : null;
        let timeStr = 'All Day';
        if (start) {
          timeStr = start.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }).toLowerCase();
        }
        return `
          <li class="calendar-item">
            <span class="event-time">${timeStr}</span>
            <div class="event-details">
              <span class="event-title">${event.summary}</span>
              ${event.description ? `<span class="event-desc">${event.description}</span>` : ''}
            </div>
          </li>
        `;
      }).join('');
    }

    // ==========================================
    // BUS ETA FETCHING (Citybus & KMB Open APIs)
    // ==========================================
    async function fetchCitybusData(stopId, route) {
      try {
        let url = route 
          ? `https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${stopId}/${route}`
          : `https://rt.data.gov.hk/v2/transport/citybus/stop-eta/CTB/${stopId}`;
        let res = await fetch(url);
        if (!res.ok) return [];
        let json = await res.json();
        let items = json.data || [];
        
        // Batch API Fallback
        if (items.length === 0 && !route) {
          let batchRes = await fetch(`https://rt.data.gov.hk/v1/transport/batch/stop-eta?company_id=CTB&stop_id=${stopId}`);
          if (batchRes.ok) {
            let batchJson = await batchRes.json();
            items = batchJson.data || [];
          }
        }
        return items;
      } catch (e) {
        console.warn(`Error fetching Citybus data for stop ${stopId}:`, e);
        return [];
      }
    }

    async function fetchKmbData(route, seqNumber) {
      try {
        const rawUrl = `https://data.etabus.gov.hk/v1/transport/kmb/route-eta/${route}`;
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(rawUrl)}`;
        
        const res = await fetch(proxyUrl);
        if (!res.ok) return [];
        const json = await res.json();
        const data = json.data || [];
        
        return data.filter(item => (item.dir === 'O' || item.bound === 'O') && item.seq === seqNumber);
      } catch (e) {
        console.warn(`Error fetching KMB data for route ${route}:`, e);
        return [];
      }
    }

    // Toggle interactive clock view
    function toggleFormat() {
      displayAs24Hour = !displayAs24Hour;
      fetchBusETA(); // Instant redraw
    }

    async function fetchBusETA() {
      const busListEl = document.getElementById('bus-list');

      try {
        const fetchRequests = BUS_STOPS.map(async (stop) => {
          let items = [];
          if (stop.routes && stop.routes.length > 0) {
            const routePromises = stop.routes.map(async r => {
              // 1. Fetch Citybus data
              let ctbItems = await fetchCitybusData(stop.id, r);
              ctbItems = ctbItems.map(item => ({ ...item, co: "CTB" }));

              // 2. Fetch KMB data if it is a joint-operated route
              if (JOINT_ROUTES.includes(r)) {
                const kmbSeq = getKmbSeq(r, stop.label);
                if (kmbSeq !== null) {
                  const kmbData = await fetchKmbData(r, kmbSeq);
                  const mappedKmb = kmbData.map(k => ({
                    route: k.route,
                    dest_en: k.dest_en,
                    dest_tc: k.dest_tc,
                    eta: k.eta,
                    co: "KMB"
                  }));
                  ctbItems = ctbItems.concat(mappedKmb);
                }
              }
              return ctbItems;
            });
            const routeResults = await Promise.all(routePromises);
            items = routeResults.flat();
          } else {
            items = await fetchCitybusData(stop.id, null);
          }
          return items.map(item => ({ ...item, stopLabel: stop.label }));
        });

        const results = await Promise.all(fetchRequests);
        const combinedData = results.flat();

        // Structure Groupings
        const stopGroups = {};
        BUS_STOPS.forEach(stop => {
          stopGroups[stop.label] = [];
        });

        const now = new Date();
        combinedData.forEach(item => {
          if (!item.eta) return;

          const etaDate = new Date(item.eta);
          const diffMins = Math.max(0, Math.round((etaDate - now) / 60000));
          const stopLabel = item.stopLabel;
          const dest = item.dest_en || item.dest_tc || 'N/A';
          const route = item.route;

          // Exclusion rules logic
          const stopConf = BUS_STOPS.find(s => s.label === stopLabel);
          if (stopConf && stopConf.excludeDest) {
            const isExcluded = stopConf.excludeDest.some(ex => dest.toLowerCase().includes(ex.toLowerCase()));
            if (isExcluded) return;
          }

          // Combine routes inside matching stop header
          let existingRoute = stopGroups[stopLabel].find(r => r.route === route);
          if (!existingRoute) {
            existingRoute = {
              route: route,
              dest: dest,
              times: []
            };
            stopGroups[stopLabel].push(existingRoute);
          }
          existingRoute.times.push({ mins: diffMins, timeObj: etaDate, co: item.co });
        });

        // Generate HTML with correct sorting and grouping
        let htmlContent = '';
        BUS_STOPS.forEach(stop => {
          const routesInStop = stopGroups[stop.label];

          // Sort incoming routes
          routesInStop.forEach(r => {
            r.times.sort((a, b) => a.mins - b.mins);
          });

          // Sort based on closest arrival time
          routesInStop.sort((a, b) => {
            const aNear = a.times.length > 0 ? a.times[0].mins : 9999;
            const bNear = b.times.length > 0 ? b.times[0].mins : 9999;
            return aNear - bNear;
          });

          if (routesInStop.length > 0) {
            htmlContent += `<li class="stop-header">📍 ${stop.label}</li>`;
            routesInStop.forEach(r => {
              let etaText = '';
              const sep = '<span class="separator"> | </span>';
              
              // Map display strings based on toggle setting (mins vs 24h clock)
              const formattedTimes = r.times.map(t => {
                if (displayAs24Hour) {
                  // Format time to 24-hour HH:MM (e.g. 17:15)
                  const h = String(t.timeObj.getHours()).padStart(2, '0');
                  const m = String(t.timeObj.getMinutes()).padStart(2, '0');
                  return `${h}:${m}`;
                } else {
                  return t.mins;
                }
              }).slice(0, 3); // Take top 3 departures

              const suffixStr = displayAs24Hour ? "" : " <span>mins</span>";

              if (formattedTimes.length === 3) {
                etaText = `${formattedTimes[0]}${sep}${formattedTimes[1]}${sep}${formattedTimes[2]}${suffixStr}`;
              } else if (formattedTimes.length === 2) {
                etaText = `${formattedTimes[0]}${sep}${formattedTimes[1]}${suffixStr}`;
              } else if (formattedTimes.length === 1) {
                etaText = `${formattedTimes[0]}${suffixStr}`;
              } else {
                etaText = `--${suffixStr}`;
              }

              // Determine nearest operator & clean dest name (Removing "To " prefix)
              const nearestCo = r.times[0] ? r.times[0].co : 'CTB';
              const routeClass = nearestCo === 'KMB' ? 'bus-route kmb-route' : 'bus-route';
              
              // Clean dest: remove any "To " prefix (case-insensitive)
              let cleanDest = r.dest;
              if (cleanDest.toLowerCase().startsWith("to ")) {
                cleanDest = cleanDest.substring(3);
              }

              htmlContent += `
                <li class="bus-item">
                  <div class="bus-info">
                    <span class="${routeClass}">${r.route}</span>
                    <div class="bus-details">
                      <span class="bus-dest">${cleanDest}</span>
                    </div>
                  </div>
                  <div class="bus-eta" onclick="toggleFormat()">
                    ${etaText}
                  </div>
                </li>
              `;
            });
          }
        });

        if (htmlContent === '') {
          busListEl.innerHTML = '<li class="loading">No upcoming departures found.</li>';
          return;
        }

        busListEl.innerHTML = htmlContent;
        lastFetchTime = new Date();
        updateRefreshBadge();

      } catch (error) {
        console.error('Error fetching Bus ETA:', error);
        busListEl.innerHTML = '<li class="error">Failed to load bus times. Will retry...</li>';
      }
    }

    // Initial load and interval setups
    fetchBusETA();
    setInterval(fetchBusETA, REFRESH_INTERVAL);

    fetchCalendarEvents();
    setInterval(fetchCalendarEvents, 600000); // 10 minutes refresh rate
  </script>
</body>
</html>
