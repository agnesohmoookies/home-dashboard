<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Home Dashboard</title>
  
  <!-- For Apple/iOS devices -->
  <link rel="apple-touch-icon" href="app-icon.png">
  <!-- For Android/Chrome devices -->
  <link rel="icon" sizes="192x192" href="app-icon.png">

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #ffffff;
      --text-sub: #a0a0a0;
      --accent: #ffc107; /* Citybus Yellow */
      --accent-green: #4caf50;
      --border-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow: hidden; /* Prevent native body scrolling */
    }

    /* Swipe Carousel Container */
    .swipe-container {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory; /* Force horizontal snapping */
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch; /* Smooth inertia scrolling for iOS */
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none;  /* IE and Edge */
    }

    .swipe-container::-webkit-scrollbar {
      display: none; /* Chrome, Safari, Opera */
    }

    /* Individual Full-Screen Pages */
    .swipe-page {
      width: 100vw;
      height: 100vh;
      flex-shrink: 0;
      scroll-snap-align: start; /* Snap page boundaries */
      padding: 12px;
      display: flex;
      flex-direction: column;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 100%;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .refresh-badge {
      font-size: 0.75rem;
      color: var(--text-sub);
      font-weight: normal;
    }

    /* Bus Stop Headers and List Styling */
    .bus-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding-bottom: 8px;
      cursor: pointer; /* Clickable list indicator */
      touch-action: manipulation; /* Removes 300ms click delay on mobile */
      -webkit-tap-highlight-color: transparent; /* Removes tap highlight box */
    }

    .stop-header {
      font-size: 1.15rem; /* Slightly larger size */
      font-weight: bold;
      color: #ffffff; /* Crisp white stop header */
      padding: 8px 0 6px 0;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stop-header:not(:first-child) {
      margin-top: 14px;
    }

    .bus-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #2a2a2a;
    }

    .bus-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bus-route {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 1.05rem;
      min-width: 55px;
      text-align: center;
    }

    /* KMB Red Operator Badge */
    .kmb-route {
      background: #e11d48 !important; /* KMB Red */
      color: #ffffff !important;
    }

    .bus-details {
      display: flex;
      flex-direction: column;
    }

    .bus-dest {
      font-size: 0.9rem;
      color: var(--text-main);
      font-weight: 500;
    }

    .bus-eta {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--accent-green);
      text-align: right;
    }

    .bus-eta span {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    /* Subtle Grey Separator Styling */
    .bus-eta .separator {
      color: var(--text-sub);
      opacity: 0.6;
      font-weight: normal;
      margin: 0 4px;
    }

    /* Custom Calendar List Styling */
    .calendar-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding-bottom: 4px;
    }

    .day-group-header {
      font-size: 1.05rem;
      font-weight: bold;
      color: #ffffff; /* White day header */
      padding: 10px 8px 6px 8px;
      background: #282828;
      border-radius: 6px;
      margin-top: 12px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .day-group-header:first-child {
      margin-top: 0;
    }

    .calendar-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 8px;
      border-bottom: 1px solid #2a2a2a;
      border-left: 4px solid var(--accent); /* Default color indicator */
      margin-bottom: 4px;
      border-radius: 4px;
      background: #181818;
    }

    .event-meta {
      display: flex;
      flex-direction: column;
      min-width: 100px;
    }

    .event-date {
      font-size: 0.9rem;
      font-weight: bold;
      color: #ffffff; /* White date text as requested */
    }

    .event-time {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .event-duration {
      font-size: 0.75rem;
      color: var(--accent-green);
      font-weight: 600;
      margin-top: 2px;
    }

    .event-details {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .event-title {
      font-size: 0.95rem;
      color: var(--text-main);
      font-weight: bold;
    }

    .event-location {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .event-desc {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .no-event-today {
      padding: 12px 10px;
      color: #ff9800; /* Subtle orange alert */
      font-size: 0.9rem;
      font-weight: bold;
      background: #252010;
      border-radius: 6px;
      border: 1px dashed #ff9800;
      margin-bottom: 10px;
    }

    .loading, .error {
      color: var(--text-sub);
      font-size: 0.85rem;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- Snapping Horizontal Carousel -->
  <div class="swipe-container">
    
    <!-- Page 1: Standalone Bus Schedule -->
    <div class="swipe-page">
      <div class="card">
        <!-- Tapping anywhere in this list flips the format instantly -->
        <ul id="bus-list" class="bus-list" onclick="toggleFormat()">
          <li class="loading">Fetching live Bus data...</li>
        </ul>
        <div class="card-footer">
          <span id="last-updated" class="refresh-badge">Updating...</span>
        </div>
      </div>
    </div>

    <!-- Page 2: Standalone Calendar Schedule (Swipe Right) -->
    <div class="swipe-page">
      <div class="card">
        <ul id="calendar-list" class="calendar-list">
          <li class="loading">Loading Google calendar...</li>
        </ul>
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // CLIENT SIDE ERROR TRACKING & LOGGING
    // ==========================================
    window.onerror = function(message, source, lineno, colno, error) {
      document.body.innerHTML = `<div style="color:red; padding:20px; font-family:monospace; background:#000; height:100vh; overflow-y:auto;">
        <h3>⚠️ Dashboard Script Error Detected</h3>
        <p style="margin-top:10px;">Please take a screenshot of this error and send it to me so I can fix it for you instantly!</p>
        <hr style="border-color:#333; margin:15px 0;">
        <p><strong>Message:</strong> ${message}</p>
        <p><strong>Line:</strong> ${lineno}:${colno}</p>
        <p><strong>Source:</strong> ${source}</p>
        <p><strong>Stack:</strong> <pre style="margin-top:5px; color:#a0a0a0; font-size:0.85rem;">${error ? error.stack : 'N/A'}</pre></p>
      </div>`;
      return false;
    };

    // ==========================================
    // CONFIGURATION
    // ==========================================
    const API_KEY = "YOUR_GOOGLE_API_KEY"; // Paste your free Google API Key here!
    const CALENDAR_ID = "agnes@ohmoookies.com"; // Your Google Calendar ID

    const BUS_STOPS = [
      { 
        id: "002364", 
        label: "South Horizons", 
        routes: ["592","595","90B","99","171","171P","N90","99X"],
        excludeDest: ["South Horizons", "Ap Lei Chau", "Ap Lei Chau Estate"] 
      }, 
      { 
        id: "002170", 
        label: "Lei Chak House", 
        routes: ["95C","671","671X"],
        excludeDest: ["South Horizons", "Ap Lei Chau", "Ap Lei Chau Estate"] 
      },
      { 
        id: "002166", 
        label: "Ap Lei Chau", 
        routes: ["90","91"],
        excludeDest: ["Ap Lei Chau", "South Horizons", "Ap Lei Chau Estate"] 
      }
    ];

    const JOINT_ROUTES = ["171", "171P", "671", "671X"];

    // Official Google Calendar Palette Mapping
    const GOOGLE_COLORS = {
      '1': '#7986cb', // Lavender
      '2': '#33b679', // Sage
      '3': '#8e24aa', // Grape
      '4': '#e67c73', // Flamingo
      '5': '#f6bf26', // Banana
      '6': '#f4511e', // Tangerine
      '7': '#039be5', // Peacock
      '8': '#616161', // Graphite
      '9': '#3f51b5', // Blueberry
      '10': '#0b8043', // Basil
      '11': '#d50000'  // Tomato
    };

    const REFRESH_INTERVAL = 30000;
    
    let cachedBusData = [];
    let isFetchingBus = false;
    let lastFetchTime = null;
    let displayAs24Hour = localStorage.getItem('busDisplayFormat') === '24h';

    function getKmbSeq(route, stopLabel) {
      if (route === "171" || route === "171P") {
        if (stopLabel === "South Horizons") return 1;
        if (stopLabel === "Lei Chak House") return 4;
      }
      if (route === "671" || route === "671X") {
        if (stopLabel === "Ap Lei Chau") return 1;
        if (stopLabel === "Lei Chak House") return 7;
      }
      return null;
    }

    function updateRefreshBadge() {
      const updatedEl = document.getElementById('last-updated');
      if (!lastFetchTime) {
        updatedEl.innerText = "Updating...";
        return;
      }
      const diffSecs = Math.floor((new Date() - lastFetchTime) / 1000);
      if (diffSecs < 60) {
        updatedEl.innerText = `Updated ${diffSecs}s ago`;
      } else {
        const mins = Math.floor(diffSecs / 60);
        updatedEl.innerText = `Updated ${mins}m ago`;
      }
    }
    setInterval(updateRefreshBadge, 1000);

    function toggleFormat() {
      displayAs24Hour = !displayAs24Hour;
      localStorage.setItem('busDisplayFormat', displayAs24Hour ? '24h' : 'mins');
      renderBusETA();
    }

    // ==========================================
    // GOOGLE CALENDAR LIVE EVENTS (Multi-Day Preview)
    // ==========================================
    const MOCK_EVENTS = [
      { summary: "🍳 Breakfast & Get Ready", start: { dateTime: new Date().setHours(7, 30, 0) }, end: { dateTime: new Date().setHours(8, 0, 0) }, description: "Check morning temperature." },
      { summary: "🚌 School Bus departure", start: { dateTime: new Date().setHours(8, 15, 0) }, end: { dateTime: new Date().setHours(8, 25, 0) }, description: "Grab lunchbox." },
      { summary: "🍱 Nutritious Lunch", start: { dateTime: new Date().setHours(12, 30, 0) }, end: { dateTime: new Date().setHours(13, 15, 0) }, description: "Meal by helper." },
      { summary: "📚 Homework & Spellings", start: { dateTime: new Date().setHours(15, 30, 0) }, end: { dateTime: new Date().setHours(16, 30, 0) }, description: "Practice reading." },
      { summary: "🚿 Shower & Change", start: { dateTime: new Date().setHours(17, 30, 0) }, end: { dateTime: new Date().setHours(18, 0, 0) }, description: "Wash up before dinner." },
      { summary: "🍽️ Dinner Time", start: { dateTime: new Date().setHours(18, 30, 0) }, end: { dateTime: new Date().setHours(19, 30, 0) }, description: "Family dinner." }
    ];

    async function fetchCalendarEvents() {
      const calendarListEl = document.getElementById('calendar-list');
      
      if (!API_KEY || API_KEY === "YOUR_GOOGLE_API_KEY" || API_KEY.trim() === "") {
        renderEvents(MOCK_EVENTS);
        return;
      }

      try {
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
        // Fetch up to 3 upcoming days
        const endOf3Days = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 3, 23, 59, 59).toISOString();
        
        const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?key=${API_KEY}&timeMin=${startOfToday}&timeMax=${endOf3Days}&singleEvents=true&orderBy=startTime`;

        const res = await fetch(url);
        if (!res.ok) throw new Error('API request failed');

        const data = await res.json();
        renderEvents(data.items || []);

      } catch (error) {
        console.error('Error fetching Google Calendar:', error);
        renderEvents(MOCK_EVENTS);
      }
    }

    function renderEvents(events) {
      const calendarListEl = document.getElementById('calendar-list');
      
      const now = new Date();
      const todayDateStr = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toDateString();

      // Group events by day string
      const dayGroups = {};
      
      events.forEach(event => {
        const start = event.start.dateTime ? new Date(event.start.dateTime) : (event.start.date ? new Date(event.start.date) : null);
        if (!start) return;

        const dayKey = new Date(start.getFullYear(), start.getMonth(), start.getDate()).toDateString();
        if (!dayGroups[dayKey]) {
          dayGroups[dayKey] = {
            dateObj: start,
            items: []
          };
        }
        dayGroups[dayKey].items.push(event);
      });

      let htmlContent = '';

      // Check if Today has events
      const hasEventsToday = dayGroups[todayDateStr] && dayGroups[todayDateStr].items.length > 0;

      if (!hasEventsToday) {
        const todayLabel = now.toLocaleDateString('en-HK', { day: 'numeric', month: 'short', weekday: 'short' });
        htmlContent += `
          <div class="day-group-header">📅 Today (${todayLabel})</div>
          <div class="no-event-today">⚠️ No events scheduled for today</div>
        `;
      }

      // Render upcoming days
      const sortedDays = Object.keys(dayGroups).sort((a, b) => new Date(a) - new Date(b));

      sortedDays.forEach(dayKey => {
        const group = dayGroups[dayKey];
        const isToday = dayKey === todayDateStr;
        const isTomorrow = dayKey === new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1).toDateString();

        let dayTitle = group.dateObj.toLocaleDateString('en-HK', { day: 'numeric', month: 'short', weekday: 'short' });
        if (isToday) dayTitle = `Today (${dayTitle})`;
        else if (isTomorrow) dayTitle = `Tomorrow (${dayTitle})`;

        htmlContent += `<div class="day-group-header">📅 ${dayTitle}</div>`;

        group.items.forEach(event => {
          const isTask = !event.start.dateTime; // All-day or Task
          const start = event.start.dateTime ? new Date(event.start.dateTime) : new Date(event.start.date);
          const end = event.end && event.end.dateTime ? new Date(event.end.dateTime) : null;

          let timeStr = 'All Day';
          let durationBadge = '';

          if (!isTask) {
            timeStr = start.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }).toLowerCase();
            
            // Calculate Duration for Events
            if (end) {
              const durMins = Math.round((end - start) / 60000);
              if (durMins > 0) {
                const h = Math.floor(durMins / 60);
                const m = durMins % 60;
                const durText = h > 0 ? (m > 0 ? `${h}h ${m}m` : `${h}h`) : `${m}m`;
                durationBadge = `<span class="event-duration">⏱️ ${durText}</span>`;
              }
            }
          }

          // Custom Google Color mapping
          const borderHex = (event.colorId && GOOGLE_COLORS[event.colorId]) ? GOOGLE_COLORS[event.colorId] : 'var(--accent)';

          htmlContent += `
            <li class="calendar-item" style="border-left-color: ${borderHex};">
              <div class="event-meta">
                <span class="event-date">${timeStr}</span>
                ${durationBadge}
              </div>
              <div class="event-details">
                <span class="event-title">${event.summary || 'No Title'}</span>
                ${event.location ? `<span class="event-location">📍 ${event.location}</span>` : ''}
                ${event.description ? `<span class="event-desc">${event.description}</span>` : ''}
              </div>
            </li>
          `;
        });
      });

      calendarListEl.innerHTML = htmlContent;
    }

    // ==========================================
    // BUS ETA FETCHING
    // ==========================================
    async function fetchCitybusData(stopId, route) {
      try {
        let url = route 
          ? `https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${stopId}/${route}`
          : `https://rt.data.gov.hk/v2/transport/citybus/stop-eta/CTB/${stopId}`;
        let res = await fetch(url);
        if (!res.ok) return [];
        let json = await res.json();
        let items = json.data || [];
        
        if (items.length === 0 && !route) {
          let batchRes = await fetch(`https://rt.data.gov.hk/v1/transport/batch/stop-eta?company_id=CTB&stop_id=${stopId}`);
          if (batchRes.ok) {
            let batchJson = await batchRes.json();
            items = batchJson.data || [];
          }
        }
        return items;
      } catch (e) {
        return [];
      }
    }

    async function fetchKmbData(route, seqNumber) {
      try {
        const rawUrl = `https://data.etabus.gov.hk/v1/transport/kmb/route-eta/${route}`;
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(rawUrl)}`;
        
        const res = await fetch(proxyUrl);
        if (!res.ok) return [];
        const json = await res.json();
        const data = json.data || [];
        
        return data.filter(item => (item.dir === 'O' || item.bound === 'O') && item.seq === seqNumber);
      } catch (e) {
        return [];
      }
    }

    async function fetchBusETA() {
      if (isFetchingBus) return;
      isFetchingBus = true;

      try {
        const fetchRequests = BUS_STOPS.map(async (stop) => {
          let items = [];
          if (stop.routes && stop.routes.length > 0) {
            const routePromises = stop.routes.map(async r => {
              let ctbItems = await fetchCitybusData(stop.id, r);
              ctbItems = ctbItems.map(item => ({ ...item, co: "CTB" }));

              if (JOINT_ROUTES.includes(r)) {
                const kmbSeq = getKmbSeq(r, stop.label);
                if (kmbSeq !== null) {
                  const kmbData = await fetchKmbData(r, kmbSeq);
                  const mappedKmb = kmbData.map(k => ({
                    route: k.route,
                    dest_en: k.dest_en,
                    dest_tc: k.dest_tc,
                    eta: k.eta,
                    co: "KMB"
                  }));
                  ctbItems = ctbItems.concat(mappedKmb);
                }
              }
              return ctbItems;
            });
            const routeResults = await Promise.all(routePromises);
            items = routeResults.flat();
          } else {
            items = await fetchCitybusData(stop.id, null);
          }
          return items.map(item => ({ ...item, stopLabel: stop.label, excludeDest: stop.excludeDest }));
        });

        const results = await Promise.all(fetchRequests);
        const validData = results.flat().filter(item => item.eta);
        
        if (validData.length > 0) {
          cachedBusData = validData;
          lastFetchTime = new Date();
          renderBusETA();
        }

      } catch (error) {
        console.error('Error fetching Bus ETA:', error);
      } finally {
        isFetchingBus = false;
      }
    }

    function renderBusETA() {
      const busListEl = document.getElementById('bus-list');
      if (cachedBusData.length === 0) return;

      const stopGroups = {};
      BUS_STOPS.forEach(stop => {
        stopGroups[stop.label] = [];
      });

      const now = new Date();
      cachedBusData.forEach(item => {
        if (!item.eta) return;

        const etaDate = new Date(item.eta);
        const diffMins = Math.max(0, Math.round((etaDate - now) / 60000));
        const stopLabel = item.stopLabel;
        
        let cleanDest = item.dest_en || item.dest_tc || 'N/A';
        if (cleanDest.toLowerCase().startsWith("to ")) {
          cleanDest = cleanDest.substring(3);
        }

        if (item.excludeDest) {
          const isExcluded = item.excludeDest.some(ex => cleanDest.toLowerCase().includes(ex.toLowerCase()));
          if (isExcluded) return;
        }

        let existingRoute = stopGroups[stopLabel].find(r => r.route === item.route);
        if (!existingRoute) {
          existingRoute = {
            route: item.route,
            dest: cleanDest,
            times: []
          };
          stopGroups[stopLabel].push(existingRoute);
        }
        existingRoute.times.push({ mins: diffMins, timeObj: etaDate, co: item.co });
      });

      let htmlContent = '';
      BUS_STOPS.forEach(stop => {
        const routesInStop = stopGroups[stop.label];

        routesInStop.forEach(r => {
          r.times.sort((a, b) => a.mins - b.mins);
        });

        routesInStop.sort((a, b) => {
          const aNear = a.times.length > 0 ? a.times[0].mins : 9999;
          const bNear = b.times.length > 0 ? b.times[0].mins : 9999;
          return aNear - bNear;
        });

        if (routesInStop.length > 0) {
          htmlContent += `<li class="stop-header">📍 ${stop.label}</li>`;
          routesInStop.forEach(r => {
            let etaText = '';
            const sep = '<span class="separator"> | </span>';
            
            const formattedTimes = r.times.map(t => {
              if (displayAs24Hour) {
                const h = String(t.timeObj.getHours()).padStart(2, '0');
                const m = String(t.timeObj.getMinutes()).padStart(2, '0');
                return `${h}:${m}`;
              } else {
                return t.mins;
              }
            }).slice(0, 3);

            const suffixStr = displayAs24Hour ? "" : " <span>mins</span>";

            if (formattedTimes.length === 3) {
              etaText = `${formattedTimes[0]}${sep}${formattedTimes}${sep}${formattedTimes}${suffixStr}`;
            } else if (formattedTimes.length === 2) {
              etaText = `${formattedTimes[0]}${sep}${formattedTimes}${suffixStr}`;
            } else if (formattedTimes.length === 1) {
              etaText = `${formattedTimes[0]}${suffixStr}`;
            } else {
              etaText = `--${suffixStr}`;
            }

            const nearestCo = r.times[0] ? r.times[0].co : 'CTB';
            const routeClass = nearestCo === 'KMB' ? 'bus-route kmb-route' : 'bus-route';

            htmlContent += `
              <li class="bus-item">
                <div class="bus-info">
                  <span class="${routeClass}">${r.route}</span>
                  <div class="bus-details">
                    <span class="bus-dest">${r.dest}</span>
                  </div>
                </div>
                <div class="bus-eta">
                  ${etaText}
                </div>
              </li>
            `;
          });
        }
      });

      if (htmlContent === '') {
        busListEl.innerHTML = '<li class="loading">No upcoming departures found.</li>';
        return;
      }

      busListEl.innerHTML = htmlContent;
      updateRefreshBadge();
    }

    // Initial load and interval setups
    fetchBusETA();
    setInterval(fetchBusETA, REFRESH_INTERVAL);

    fetchCalendarEvents();
    setInterval(fetchCalendarEvents, 600000); // 10 minutes refresh rate
  </script>
</body>
</html>
