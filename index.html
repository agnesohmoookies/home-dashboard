<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Dashboard</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #ffffff;
      --text-sub: #a0a0a0;
      --accent: #ffc107; /* Citybus Yellow */
      --accent-green: #4caf50;
      --border-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 8px;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: row; /* Aligns Bus and Calendar side-by-side horizontally */
      flex: 1;
      gap: 8px;
      height: 100%;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 100%;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 4px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .refresh-badge {
      font-size: 0.7rem;
      color: var(--text-sub);
      font-weight: normal;
    }

    /* Bus Stop Headers and List Styling */
    .bus-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding-bottom: 4px;
    }

    .stop-header {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--accent); /* Yellow stop header */
      padding: 6px 0 4px 0;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stop-header:not(:first-child) {
      margin-top: 8px;
    }

    .bus-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid #2a2a2a;
    }

    .bus-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bus-route {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9rem;
      min-width: 45px;
      text-align: center;
    }

    .bus-details {
      display: flex;
      flex-direction: column;
    }

    .bus-dest {
      font-size: 0.8rem;
      color: var(--text-main);
      font-weight: 500;
    }

    .bus-eta {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-green);
      text-align: right;
    }

    .bus-eta span {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-left: 2px;
    }

    .loading, .error {
      color: var(--text-sub);
      font-size: 0.8rem;
      text-align: center;
      margin-top: 10px;
    }

    /* Calendar Container */
    .calendar-container {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Section 1: Bus Arrivals (Citybus) -->
    <div class="card">
      <ul id="bus-list" class="bus-list">
        <li class="loading">Fetching live Citybus data...</li>
      </ul>
      <div class="card-footer">
        <span id="last-updated" class="refresh-badge">Updating...</span>
      </div>
    </div>

    <!-- Section 2: Son's Schedule -->
    <div class="card">
      <div class="calendar-container">
        <iframe 
          id="calendar-iframe"
          src="https://calendar.google.com/calendar/embed?height=600&wkst=2&ctz=Asia%2FHong_Kong&showPrint=0&mode=AGENDA&showTz=0&showDate=0&showNav=0&title&showTabs=0&src=YWduZXNAb2htb29va2llcy5jb20&color=%23039be5" 
          style="border: 0" 
          frameborder="0" 
          scrolling="no">
        </iframe>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURATION: Citybus Stops & Route Filter
    // ==========================================
    const BUS_STOPS = [
      { 
        id: "002364", 
        label: "South Horizons", 
        routes: ["592","595","90B","99","171","171P","N90","99X"],
        excludeDest: ["South Horizons", "Ap Lei Chau", "Ap Lei Chau Estate"] 
      }, 
      { 
        id: "002170", 
        label: "Lei Chak House", 
        routes: ["95C","671","671X"],
        excludeDest: ["South Horizons", "Ap Lei Chau", "Ap Lei Chau Estate"] 
      },
      { 
        id: "002166", 
        label: "Ap Lei Chau", 
        routes: ["90","91"],
        excludeDest: ["Ap Lei Chau", "South Horizons", "Ap Lei Chau Estate"] 
      }
    ];

    const REFRESH_INTERVAL = 30000;
    let lastFetchTime = null;

    // Relative Live Time Counter
    function updateRefreshBadge() {
      const updatedEl = document.getElementById('last-updated');
      if (!lastFetchTime) {
        updatedEl.innerText = "Updating...";
        return;
      }
      const diffSecs = Math.floor((new Date() - lastFetchTime) / 1000);
      if (diffSecs < 60) {
        updatedEl.innerText = `Updated ${diffSecs}s ago`;
      } else {
        const mins = Math.floor(diffSecs / 60);
        updatedEl.innerText = `Updated ${mins}m ago`;
      }
    }
    setInterval(updateRefreshBadge, 1000);

    async function fetchCitybusData(stopId, route) {
      try {
        let url = route 
          ? `https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${stopId}/${route}`
          : `https://rt.data.gov.hk/v2/transport/citybus/stop-eta/CTB/${stopId}`;
        let res = await fetch(url);
        if (!res.ok) return [];
        let json = await res.json();
        let items = json.data || [];
        
        // Batch API Fallback
        if (items.length === 0 && !route) {
          let batchRes = await fetch(`https://rt.data.gov.hk/v1/transport/batch/stop-eta?company_id=CTB&stop_id=${stopId}`);
          if (batchRes.ok) {
            let batchJson = await batchRes.json();
            items = batchJson.data || [];
          }
        }
        return items;
      } catch (e) {
        console.warn(`Error fetching Citybus data for stop ${stopId}:`, e);
        return [];
      }
    }

    async function fetchBusETA() {
      const busListEl = document.getElementById('bus-list');

      try {
        const fetchRequests = BUS_STOPS.map(async (stop) => {
          let items = [];
          if (stop.routes && stop.routes.length > 0) {
            const routePromises = stop.routes.map(r => fetchCitybusData(stop.id, r));
            const routeResults = await Promise.all(routePromises);
            items = routeResults.flat();
          } else {
            items = await fetchCitybusData(stop.id, null);
          }
          return items.map(item => ({ ...item, stopLabel: stop.label }));
        });

        const results = await Promise.all(fetchRequests);
        const combinedData = results.flat();

        // Structure Groupings
        const stopGroups = {};
        BUS_STOPS.forEach(stop => {
          stopGroups[stop.label] = [];
        });

        const now = new Date();
        combinedData.forEach(item => {
          if (!item.eta) return;

          const etaDate = new Date(item.eta);
          const diffMins = Math.max(0, Math.round((etaDate - now) / 60000));
          const stopLabel = item.stopLabel;
          const dest = item.dest_en || item.dest_tc || 'N/A';
          const route = item.route;

          // Exclusion rules logic
          const stopConf = BUS_STOPS.find(s => s.label === stopLabel);
          if (stopConf && stopConf.excludeDest) {
            const isExcluded = stopConf.excludeDest.some(ex => dest.toLowerCase().includes(ex.toLowerCase()));
            if (isExcluded) return;
          }

          // Combine routes inside matching stop header
          let existingRoute = stopGroups[stopLabel].find(r => r.route === route);
          if (!existingRoute) {
            existingRoute = {
              route: route,
              dest: dest,
              times: []
            };
            stopGroups[stopLabel].push(existingRoute);
          }
          existingRoute.times.push(diffMins);
        });

        // HTML builder with customized layouts
        let htmlContent = '';
        BUS_STOPS.forEach(stop => {
          const routesInStop = stopGroups[stop.label];

          // Sort incoming routes
          routesInStop.forEach(r => {
            r.times.sort((a, b) => a - b);
          });

          // Sort based on closest arrival time
          routesInStop.sort((a, b) => {
            const aNear = a.times.length > 0 ? a.times[0] : 9999;
            const bNear = b.times.length > 0 ? b.times[0] : 9999;
            return aNear - bNear;
          });

          if (routesInStop.length > 0) {
            htmlContent += `<li class="stop-header">📍 ${stop.label}</li>`;
            routesInStop.forEach(r => {
              let etaText = '';
              if (r.times.length === 1) {
                etaText = `${r.times[0]} <span>mins</span>`;
              } else if (r.times.length >= 2) {
                etaText = `${r.times[0]} | ${r.times[1]} <span>mins</span>`;
              } else {
                etaText = `-- <span>mins</span>`;
              }

              htmlContent += `
                <li class="bus-item">
                  <div class="bus-info">
                    <span class="bus-route">${r.route}</span>
                    <div class="bus-details">
                      <span class="bus-dest">To ${r.dest}</span>
                    </div>
                  </div>
                  <div class="bus-eta">
                    ${etaText}
                  </div>
                </li>
              `;
            });
          }
        });

        if (htmlContent === '') {
          busListEl.innerHTML = '<li class="loading">No upcoming departures found.</li>';
          return;
        }

        busListEl.innerHTML = htmlContent;
        lastFetchTime = new Date();
        updateRefreshBadge();

      } catch (error) {
        console.error('Error fetching Citybus ETA:', error);
        busListEl.innerHTML = '<li class="error">Failed to load bus times. Will retry...</li>';
      }
    }

    fetchBusETA();
    setInterval(fetchBusETA, REFRESH_INTERVAL);
  </script>
</body>
</html>
