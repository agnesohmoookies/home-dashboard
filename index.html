<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Dashboard</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #ffffff;
      --text-sub: #a0a0a0;
      --accent: #ffc107; /* Citybus Yellow */
      --accent-green: #4caf50;
      --border-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 12px;
      gap: 12px;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .time-display {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--text-main); /* White color */
    }

    .date-display {
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    .container {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 12px;
      height: calc(100% - 60px);
    }

    @media (min-width: 600px) {
      .container {
        flex-direction: row;
      }
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }

    .refresh-badge {
      font-size: 0.75rem;
      color: var(--text-sub);
      font-weight: normal;
    }

    /* Bus ETA List Styling */
    .bus-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
    }

    .bus-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #2a2a2a;
    }

    .bus-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bus-route {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 1.05rem;
      min-width: 55px;
      text-align: center;
    }

    .bus-details {
      display: flex;
      flex-direction: column;
    }

    .bus-dest {
      font-size: 0.9rem;
      color: var(--text-main);
      font-weight: 500;
    }

    .bus-stop-label {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .bus-eta {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--accent-green);
    }

    .bus-eta span {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .loading, .error {
      color: var(--text-sub);
      font-size: 0.9rem;
      text-align: center;
      margin-top: 20px;
    }

    /* Calendar Container */
    .calendar-container {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div id="clock" class="time-display">00:00</div>
      <div id="date" class="date-display">Loading date...</div>
    </div>
  </header>

  <div class="container">
    <!-- Section 1: Bus Departures -->
    <div class="card">
      <div class="card-title">
        <span>🚍 Bus Departing in...</span>
        <span id="last-updated" class="refresh-badge">Updating...</span>
      </div>
      <ul id="bus-list" class="bus-list">
        <li class="loading">Fetching live Citybus data...</li>
      </ul>
    </div>

    <!-- Section 2: Son's Schedule -->
    <div class="card">
      <div class="card-title">
        <span>📅 Today's Schedule</span>
      </div>
      <div class="calendar-container">
        <!-- Google Calendar Agenda view iframe -->
        <iframe 
          id="calendar-iframe"
          src="https://calendar.google.com/calendar/embed?height=600&wkst=2&ctz=Asia%2FHong_Kong&showPrint=0&mode=AGENDA&showTz=0&showDate=0&showNav=0&title&showTabs=0&src=YWduZXNAb2htb29va2llcy5jb20&color=%23039be5" 
          style="border: 0" 
          frameborder="0" 
          scrolling="no">
        </iframe>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURATION: Citybus Stops & Exclusions
    // ==========================================
    const BUS_STOPS = [
      { 
        id: "002364", 
        label: "South Horizons", 
        routes: ["592","595","90B","99","171","171P","N90","99X"],
        excludeDest: ["South Horizons"] 
      }, 
      { 
        id: "002170", 
        label: "Lei Chak House", 
        routes: ["95C","671","671X"],
        excludeDest: ["South Horizons", "Ap Lei Chau"] 
      },
      { 
        id: "002166", 
        label: "Ap Lei Chau", 
        routes: ["90","91"],
        excludeDest: ["Ap Lei Chau", "South Horizons"] 
      }
    ];

    const REFRESH_INTERVAL = 30000;

    // ==========================================
    // CLOCK & DATE (12-Hour AM/PM White Display)
    // ==========================================
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', { 
        hour: '2-digit', 
        minute: '2-digit', 
        hour12: true 
      }).toLowerCase();

      document.getElementById('date').innerText = now.toLocaleDateString('en-HK', { 
        weekday: 'short', 
        day: 'numeric',
        month: 'short'
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ==========================================
    // BUS ETA FETCHING & SUBSTRING FILTERING
    // ==========================================
    async function fetchCitybusData(stopId, route) {
      try {
        let url = route 
          ? `https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${stopId}/${route}`
          : `https://rt.data.gov.hk/v2/transport/citybus/stop-eta/CTB/${stopId}`;
        let res = await fetch(url);
        if (!res.ok) return [];
        let json = await res.json();
        let items = json.data || [];

        if (items.length === 0 && !route) {
          let batchRes = await fetch(`https://rt.data.gov.hk/v1/transport/batch/stop-eta?company_id=CTB&stop_id=${stopId}`);
          if (batchRes.ok) {
            let batchJson = await batchRes.json();
            items = batchJson.data || [];
          }
        }
        return items;
      } catch (e) {
        console.warn(`Error fetching Citybus data for stop ${stopId}:`, e);
        return [];
      }
    }

    async function fetchBusETA() {
      const busListEl = document.getElementById('bus-list');
      const updatedEl = document.getElementById('last-updated');

      try {
        const fetchRequests = BUS_STOPS.map(async (stop) => {
          let items = [];
          if (stop.routes && stop.routes.length > 0) {
            const routePromises = stop.routes.map(r => fetchCitybusData(stop.id, r));
            const routeResults = await Promise.all(routePromises);
            items = routeResults.flat();
          } else {
            items = await fetchCitybusData(stop.id, null);
          }

          return items.map(item => ({ 
            ...item, 
            stopLabel: stop.label, 
            excludeDest: stop.excludeDest || [] 
          }));
        });

        const results = await Promise.all(fetchRequests);
        const combinedData = results.flat();

        if (combinedData.length === 0) {
          busListEl.innerHTML = '<li class="loading">No upcoming departures found for selected routes right now.</li>';
          return;
        }

        const now = new Date();
        const arrivals = combinedData
          .filter(item => item.eta)
          .filter(item => {
            if (!item.excludeDest || item.excludeDest.length === 0) return true;
            const destEn = (item.dest_en || '').toLowerCase();
            const destTc = (item.dest_tc || '').toLowerCase();
            
            // Substring match: removes any destination containing excluded phrases
            const isExcluded = item.excludeDest.some(ex => {
              const kw = ex.toLowerCase().trim();
              return destEn.includes(kw) || destTc.includes(kw);
            });
            
            return !isExcluded;
          })
          .map(item => {
            const etaDate = new Date(item.eta);
            const diffMins = Math.max(0, Math.round((etaDate - now) / 60000));
            return {
              route: item.route,
              dest: item.dest_en || item.dest_tc || 'N/A',
              stopLabel: item.stopLabel,
              mins: diffMins
            };
          })
          .sort((a, b) => a.mins - b.mins)
          .slice(0, 8);

        if (arrivals.length === 0) {
          busListEl.innerHTML = '<li class="loading">No scheduled outbound departures soon.</li>';
          return;
        }

        busListEl.innerHTML = arrivals.map(item => `
          <li class="bus-item">
            <div class="bus-info">
              <span class="bus-route">${item.route}</span>
              <div class="bus-details">
                <span class="bus-dest">To ${item.dest}</span>
                <span class="bus-stop-label">📍 ${item.stopLabel}</span>
              </div>
            </div>
            <div class="bus-eta">
              ${item.mins} <span>min${item.mins === 1 ? '' : 's'}</span>
            </div>
          </li>
        `).join('');

        const updateTime = new Date().toLocaleTimeString('en-US', { 
          hour: '2-digit', 
          minute: '2-digit', 
          second: '2-digit',
          hour12: true 
        }).toLowerCase();
        updatedEl.innerText = `Updated ${updateTime}`;

      } catch (error) {
        console.error('Error fetching Citybus ETA:', error);
        busListEl.innerHTML = '<li class="error">Failed to load bus times. Will retry...</li>';
      }
    }

    fetchBusETA();
    setInterval(fetchBusETA, REFRESH_INTERVAL);
  </script>
</body>
</html>
